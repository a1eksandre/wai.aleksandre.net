<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where Am I</title>
<meta http-equiv="refresh" content="3; url=https://play.google.com/store/apps/details?id=net.aleksandre.android.whereami">
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;min-height:100vh;
display:grid;place-items:center;background:#fafafa;color:#1b1b1b}
@media(prefers-color-scheme:dark){body{background:#101312;color:#e8eceb}}
main{text-align:center;padding:2rem}
a{display:inline-block;margin-top:1rem;padding:.7rem 1.2rem;border-radius:999px;
background:#00796b;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Where Am I</h1>
  <p>One moment&hellip;</p>
  <a href="https://play.google.com/store/apps/details?id=net.aleksandre.android.whereami">Get the app</a>
</main>
<script>
(function () {
  var PLAY = "https://play.google.com/store/apps/details?id=net.aleksandre.android.whereami";
  var BASE = "https://www.aleksandre.net/wai";
  var probe = BASE + location.pathname + location.search;
  fetch(probe, { method: "HEAD" })
    .then(function (r) { location.replace(r.ok ? probe + location.hash : PLAY); })
    .catch(function () { location.replace(PLAY); });
})();
</script>
</body>
</html>
